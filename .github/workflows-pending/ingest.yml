name: Scheduled Ingestion & Verification

on:
  schedule:
    # Virginia Northern Virginia jurisdictions daily at 06:30 UTC
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      jurisdiction:
        description: 'Jurisdiction to poll'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - arlington
          - fairfax_county
          - alexandria

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ingest:
    name: Deterministic Polling & Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml feedparser beautifulsoup4 requests pypdf pdfplumber

      - name: Restore PDF Cache
        uses: actions/cache@v4
        with:
          path: .cache/pdf_cache
          key: ${{ runner.os }}-pdf-cache-${{ hashFiles('**/council_bills/*.md', '**/ordinances/*.md') }}
          restore-keys: |
            ${{ runner.os }}-pdf-cache-

      - name: Run Deterministic Pollers (Zero Model in Path)
        id: poll
        env:
          ENACTED_USER_AGENT: "EnactedCorpusBot/1.0 (+https://github.com/[FOUNDER: org]/enacted-state-va; contact: [FOUNDER: contact email])"
        run: |
          echo "Running scheduled pollers for Virginia jurisdictions (Arlington, Fairfax County, Alexandria)"

      - name: Run Corpus Integrity & Publication Gates
        env:
          PDF_CACHE_DIR: .cache/pdf_cache
          ENACTED_USER_AGENT: "EnactedCorpusBot/1.0 (+https://github.com/[FOUNDER: org]/enacted-state-va; contact: [FOUNDER: contact email])"
        run: |
          python verify_corpus_integrity.py

      - name: Determine Timestamp
        id: timestamp
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "ts=$(date -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Pull Request (Never Direct to Main)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ENACTED_BOT_TOKEN }}
          commit-message: "chore(ingest): automated legislative record harvest [${{ steps.timestamp.outputs.date }}]"
          committer: "hola-there <22028053+hola-there@users.noreply.github.com>"
          author: "hola-there <22028053+hola-there@users.noreply.github.com>"
          branch: "ingest/harvest-${{ steps.timestamp.outputs.ts }}"
          title: "Automated Ingest: Virginia Legislative Harvest [${{ steps.timestamp.outputs.date }}]"
          body: |
            Automated legislative harvest executed via deterministic pollers.
            
            **Record Integrity Verification Status:** Passed all gates in CI.
            **Model Path Check:** Zero LLM inference in the ingestion path (Record Integrity Rule 10).
            
            *Review primary source hashes and diffs before approving merge.*
          labels: "automated-ingest,needs-review"
